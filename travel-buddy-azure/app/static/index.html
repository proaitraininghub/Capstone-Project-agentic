<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Buddy</title>
<style>
  :root { --brand:#0f766e; --brand-dark:#0b5a54; --bg:#f3f4f6; --bot:#ffffff; --user:#0f766e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:#111827; height:100vh; display:flex; flex-direction:column; }
  header { background:var(--brand); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header .who { font-size:13px; opacity:.9; }
  header a, header button { color:#fff; background:transparent; border:1px solid rgba(255,255,255,.6); border-radius:6px; padding:5px 10px; font-size:13px; cursor:pointer; text-decoration:none; }
  header a:hover, header button:hover { background:var(--brand-dark); }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:820px; width:100%; margin:0 auto; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--user); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--bot); border:1px solid #e5e7eb; border-bottom-left-radius:4px; }
  .bot.pending { color:#6b7280; font-style:italic; }
  .bot.error { border-color:#fca5a5; background:#fef2f2; color:#991b1b; }
  .tools { margin-top:6px; font-size:12px; color:#6b7280; }
  .tag { display:inline-block; background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; border-radius:999px; padding:1px 8px; margin-right:4px; }
  form { display:flex; gap:8px; padding:12px 16px; background:#fff; border-top:1px solid #e5e7eb; max-width:820px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; border:1px solid #d1d5db; border-radius:10px; padding:10px 12px; font:inherit; height:46px; overflow:hidden; }
  textarea:focus { outline:2px solid var(--brand); border-color:transparent; }
  #send { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:0 20px; font-size:15px; cursor:pointer; }
  #send:disabled { background:#9ca3af; cursor:not-allowed; }
  .hint { text-align:center; font-size:12px; color:#6b7280; padding:0 0 8px; }
</style>
</head>
<body>
<header>
  <h1>Travel Buddy</h1>
  <span class="who" id="who"></span>
  <a id="signout" href="/.auth/logout?post_logout_redirect_uri=/" style="display:none">Sign out</a>
  <button id="newchat" type="button">New chat</button>
</header>

<div id="chat" aria-live="polite"></div>

<form id="form">
  <textarea id="box" maxlength="500" placeholder="Ask about a city or landmark..." aria-label="Your message"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<div class="hint">Answers come from saved city facts and Wikipedia. Please do not share personal data.</div>

<script>
(function () {
  var chat = document.getElementById("chat");
  var form = document.getElementById("form");
  var box = document.getElementById("box");
  var sendBtn = document.getElementById("send");
  var sessionId = null;
  var busy = false;

  try { sessionId = sessionStorage.getItem("tb_session"); } catch (e) {}

  function remember(id) {
    sessionId = id;
    try { sessionStorage.setItem("tb_session", id); } catch (e) {}
  }

  // Add a bubble. Text is always set with textContent, never as HTML, so nothing typed
  // by a user or returned by the model can inject code into the page.
  function addMessage(kind, text, tools) {
    var div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    if (tools && tools.length) {
      var t = document.createElement("div");
      t.className = "tools";
      t.appendChild(document.createTextNode("Used: "));
      tools.forEach(function (name) {
        var tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = name;
        t.appendChild(tag);
      });
      div.appendChild(t);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function setBusy(value) {
    busy = value;
    sendBtn.disabled = value;
    box.disabled = value;
    if (!value) box.focus();
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function ask(text) {
    var pending = addMessage("bot pending", "Travel Buddy is thinking...");
    function fail(message) {
      pending.className = "msg bot error";
      pending.textContent = message;
    }
    try {
      var res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });

      if (res.status === 429) {
        var wait = res.headers.get("Retry-After") || "a moment";
        return fail("You are sending messages too quickly. Please wait " + wait + " seconds and try again.");
      }
      if (res.status === 400) return fail("That message could not be sent. Please rephrase it.");
      if (res.status === 401 || res.status === 403) return fail("Your sign-in has expired. Please reload the page.");
      if (!res.ok) return fail("Something went wrong (" + res.status + "). Please try again.");

      var body = await res.json();
      remember(body.session_id);

      // Answered from the cache: no waiting needed
      var started = Date.now();
      var delay = 800;
      while (body.status !== "done") {
        if (body.status === "failed") return fail(body.error || "Travel Buddy could not answer. Please try again.");
        if (Date.now() - started > 120000) return fail("This is taking too long. Please try again.");
        await sleep(delay);
        delay = Math.min(delay + 300, 2000);   // poll a little slower the longer it takes
        var poll = await fetch("/chat/" + encodeURIComponent(body.task_id));
        if (!poll.ok) return fail("Something went wrong (" + poll.status + "). Please try again.");
        var next = await poll.json();
        next.task_id = body.task_id;
        body = next;
        if (body.status === "retrying") pending.textContent = "Travel Buddy is busy, trying again...";
      }

      pending.className = "msg bot";
      pending.textContent = body.answer;
      if (body.tools_used && body.tools_used.length) {
        var t = document.createElement("div");
        t.className = "tools";
        t.appendChild(document.createTextNode("Used: "));
        body.tools_used.forEach(function (name) {
          var tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = name;
          t.appendChild(tag);
        });
        pending.appendChild(t);
      }
      chat.scrollTop = chat.scrollHeight;
    } catch (err) {
      fail("Could not reach Travel Buddy. If you were signed in, please reload the page.");
    }
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var text = box.value.trim();
    if (!text || busy) return;
    addMessage("user", text);
    box.value = "";
    setBusy(true);
    await ask(text);
    setBusy(false);
  });

  // Enter sends, Shift+Enter makes a new line
  box.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  document.getElementById("newchat").addEventListener("click", function () {
    sessionId = null;
    try { sessionStorage.removeItem("tb_session"); } catch (e) {}
    chat.textContent = "";
    greet();
  });

  function greet() {
    addMessage("bot", "Hi! I'm Travel Buddy. Ask me about Paris, Tokyo or Lisbon, or about any landmark.");
  }

  // Who is signed in? (empty when sign-in is not switched on)
  fetch("/me").then(function (r) { return r.ok ? r.json() : null; }).then(function (me) {
    if (me && me.user) {
      document.getElementById("who").textContent = me.user;
      document.getElementById("signout").style.display = "";
    }
  }).catch(function () {});

  greet();
  box.focus();
})();
</script>
</body>
</html>
