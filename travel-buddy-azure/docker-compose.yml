# Run the WHOLE system on your laptop with one command:   docker compose up --build
# Starts three containers: redis, api (port 8000), worker.
# Uses your .env file. For a laptop, set USE_OPENAI=true (the container cannot use "az login").
# Then:  python smoke_test.py http://localhost:8000
services:
  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [redis]

  worker:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on: [redis]
